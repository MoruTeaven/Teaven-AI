# Teaven AI Gateway — Nginx 站点配置
# 部署到徐州：/etc/nginx/sites-available/teaven-ai
# 启用：ln -sf /etc/nginx/sites-available/teaven-ai /etc/nginx/sites-enabled/
# 公网入口：mky.aini2.cn:55555 (NAT→80) → nginx 按 Host 路由
# EdgeOne 回源 Host: model.chenyande.com

server {
    listen 80;
    server_name model.chenyande.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE 流式响应：禁用 buffering + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
